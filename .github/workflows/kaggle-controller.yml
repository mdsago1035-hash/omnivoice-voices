name: OmniVoice Kaggle Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  controller:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install -q kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Kaggle API configured."

      - name: Check worker status
        id: status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e

          STATUS=$(kaggle kernels status mdsago1035-hash/notebookad0f3f61b4 2>&1)

          echo "$STATUS"

          if echo "$STATUS" | grep -qi "RUNNING"; then
            echo "running=true" >> "$GITHUB_OUTPUT"
            echo "🟢 OmniVoice worker is RUNNING."
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "🔴 OmniVoice worker is not RUNNING."
          fi

      - name: Restart Kaggle worker
        if: steps.status.outputs.running == 'false'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "🚀 Starting OmniVoice Kaggle worker..."

          rm -rf /tmp/omnivoice_worker
          mkdir -p /tmp/omnivoice_worker

          kaggle kernels pull \
            mdsago1035-hash/notebookad0f3f61b4 \
            -p /tmp/omnivoice_worker \
            -m

          kaggle kernels push \
            -p /tmp/omnivoice_worker

          echo "✅ Kaggle worker start triggered."

      - name: Controller finished
        run: |
          echo "🟢 OmniVoice Controller completed successfully."
