name: OmniVoice Kaggle Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  controller:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          pip install -q kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.config/kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.config/kaggle/api_token
          chmod 600 ~/.config/kaggle/api_token

      - name: Check OmniVoice worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL="sagor10/notebookad0f3f61b4"

          echo "================================="
          echo "OmniVoice Kaggle Worker"
          echo "Notebook: $KERNEL"
          echo "================================="

          echo "Kaggle status:"
          kaggle kernels status "$KERNEL" || true

      - name: Controller heartbeat
        run: |
          echo "🟢 Controller check completed."
