name: Kaggle Auto Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  controller:
    runs-on: ubuntu-latest

    steps:

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

      - name: Check Kaggle Worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e

          USERNAME="sagor10"
          NOTEBOOK="notebook16dd24d0ef"
          FULL_SLUG="${USERNAME}/${NOTEBOOK}"

          echo "🔎 Checking Kaggle Worker..."

          RESPONSE=$(curl -sS \
            -X POST \
            -H "Authorization: Bearer ${KAGGLE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.kaggle.com/v1/kernels.KernelsApiService/GetKernelSessionStatus" \
            -d "{\"userName\":\"${USERNAME}\",\"kernelSlug\":\"${NOTEBOOK}\"}")

          echo "📡 Kaggle response:"
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          d=json.load(sys.stdin)
          print(d.get("status",""))
          ')

          echo "📊 Worker status: $STATUS"

          if [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "QUEUED" ]; then
            echo "🟢 Kaggle Worker already active."
            exit 0
          fi

          echo "🔴 Worker is not active."
          echo "🚀 Starting Kaggle Worker..."

          rm -rf kaggle_worker
          mkdir -p kaggle_worker

          kaggle kernels pull "$FULL_SLUG" \
            -p kaggle_worker \
            -m

          cd kaggle_worker

          echo "🔧 Ensuring private secret dataset is attached..."

          python - <<'PY'
          import json

          path = "kernel-metadata.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          datasets = data.get("dataset_sources", [])

          required = "sagor10/omnivoice-secret"

          if required not in datasets:
              datasets.append(required)

          data["dataset_sources"] = datasets
          data["enable_gpu"] = True
          data["enable_internet"] = True
          data["is_private"] = True
          data["machine_shape"] = "NvidiaTeslaT4"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("✅ Dataset attachment confirmed:")
          print(data["dataset_sources"])
          PY

          echo "🚀 Pushing Kaggle Worker..."

          kaggle kernels push -p .

          echo "✅ Kaggle Worker start command sent."
