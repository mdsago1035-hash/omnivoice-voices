name: OmniVoice Kaggle Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  controller:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install -q kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "❌ KAGGLE_API_TOKEN secret missing."
            exit 1
          fi

          echo "✅ Kaggle API token detected."

      - name: Check Kaggle Worker
        id: worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL="sagor10/notebookad0f3f61b4"

          echo "========================================"
          echo "🔎 Checking OmniVoice Kaggle Worker"
          echo "Notebook: $KERNEL"
          echo "========================================"

          set +e
          STATUS=$(kaggle kernels status "$KERNEL" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$STATUS"

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Kaggle status command failed."
            echo "⚠️ Worker will NOT be restarted automatically."
            exit 1
          fi

          if echo "$STATUS" | grep -Eqi "RUNNING|QUEUED"; then
            echo "running=true" >> "$GITHUB_OUTPUT"
            echo "🟢 OmniVoice Worker is RUNNING/QUEUED."

          elif echo "$STATUS" | grep -Eqi "COMPLETE|ERROR"; then
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "🔴 OmniVoice Worker is not running."

          else
            echo "⚠️ Unknown Kaggle status."
            echo "⚠️ No automatic restart will be attempted."
            exit 1
          fi

      - name: Restart Kaggle Worker
        if: steps.worker.outputs.running == 'false'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL="sagor10/notebookad0f3f61b4"
          WORKDIR="/tmp/omnivoice-kernel"

          echo "🚀 Starting OmniVoice Worker..."

          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          echo "📥 Pulling latest Kaggle notebook..."
          kaggle kernels pull "$KERNEL" \
            -p "$WORKDIR" \
            -m

          echo "📤 Pushing notebook to Kaggle..."
          kaggle kernels push \
            -p "$WORKDIR"

          echo "✅ OmniVoice Worker restart triggered."

      - name: Controller Finished
        run: |
          echo "========================================"
          echo "🟢 OmniVoice Controller finished."
          echo "========================================"
