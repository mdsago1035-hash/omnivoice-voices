name: Kaggle Voice Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  check-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: pip install -q kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token

      - name: Check Kaggle Worker
        run: |
          kaggle kernels status sagor10/notebookb697ba5e2d
